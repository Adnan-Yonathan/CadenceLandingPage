<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Get Cadence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--cream:#f1f0e4;--sage:#94a894;--dim:#6f8570;--lime:#a3d13a;--card:#1e3320;--raised:#24401f;--deep:#0f1c12;--line:rgba(241,240,228,.12)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100dvh}
body{background:radial-gradient(115% 55% at 50% 0,#24401f 0,var(--deep) 58%,#070f09 100%);
color:var(--cream);font-family:Manrope,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;
display:flex;flex-direction:column;align-items:center;justify-content:center;
padding:calc(env(safe-area-inset-top) + 84px) 22px calc(env(safe-area-inset-bottom) + 34px);text-align:center}

.icon{width:104px;height:104px;border-radius:26px;display:block;margin:0 auto 24px;
box-shadow:0 0 0 1px rgba(241,240,228,.08),0 20px 54px rgba(0,0,0,.55),0 0 70px rgba(163,209,58,.16)}
h1{font-size:31px;line-height:1.1;letter-spacing:-.045em;margin:0 0 12px}
h1 .accent{color:var(--lime)}
.lede{font-size:15px;line-height:1.55;color:var(--sage);margin:0 0 30px;max-width:330px}

.steps{width:100%;max-width:360px;background:rgba(0,0,0,.26);border:1px solid var(--line);
border-radius:18px;overflow:hidden;text-align:left}
.step{display:flex;align-items:center;gap:13px;padding:15px 16px;font-size:15px;line-height:1.4;font-weight:600}
.step+.step{border-top:1px solid var(--line)}
.step i{flex:none;width:23px;height:23px;border-radius:50%;background:rgba(163,209,58,.14);
color:var(--lime);font-style:normal;font-size:12px;font-weight:800;display:grid;place-items:center}
.glyph{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:25px;
padding:0 8px;margin:0 2px;border-radius:7px;background:var(--raised);border:1px solid var(--line);
color:var(--cream);font-size:13px;font-weight:800;vertical-align:middle;letter-spacing:.06em}
.cta{display:block;width:100%;max-width:360px;margin:20px auto 0;border-radius:999px;min-height:52px;
line-height:52px;background:var(--lime);color:#10200c;font-weight:800;font-size:16px;text-decoration:none}
.tagline{font-size:13px;line-height:1.5;color:var(--dim);margin:28px 0 0;max-width:300px}

/* The default state: a beat of explanation while the redirect fires, so the
   jump does not look like a glitch. */
.sending{display:flex;flex-direction:column;align-items:center;gap:16px}
.sending .ring{width:34px;height:34px;border-radius:50%;border:3px solid rgba(241,240,228,.13);
border-top-color:var(--lime);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Only reached when the redirect demonstrably did not happen. */
.stuck{display:none}
body[data-mode="stuck"] .sending{display:none}
body[data-mode="stuck"] .stuck{display:block}
</style>
</head>
<body data-mode="sending">

  <div class="sending" aria-live="polite">
    <img class="icon" src="images/app-icon.png" alt="Cadence" width="104" height="104" style="margin-bottom:6px">
    <div class="ring"></div>
    <p class="lede" style="margin:0">Opening the App&nbsp;Store…</p>
  </div>

  <div class="stuck">
    <img class="icon" src="images/app-icon.png" alt="Cadence" width="104" height="104">
    <h1>Get <span class="accent">Cadence</span></h1>
    <p class="lede" id="lede" style="margin-left:auto;margin-right:auto">Tap below to open the App&nbsp;Store.</p>

    <a class="cta" id="cta" data-cta="get_page_fallback" href="https://apps.apple.com/us/app/cadence-run-coach/id6783027833">Open the App Store</a>

    <div class="steps" id="steps" style="margin:22px auto 0;display:none">
      <div class="step"><i>1</i><span>Tap the <span class="glyph">•••</span> menu, top right</span></div>
      <div class="step"><i>2</i><span>Choose <span class="glyph" style="font-size:12px;letter-spacing:0">Open in browser</span></span></div>
      <div class="step"><i>3</i><span>The App&nbsp;Store opens on its own</span></div>
    </div>

    <p class="tagline" style="margin-left:auto;margin-right:auto">The running coach that keeps you accountable.</p>
  </div>

<script src="assets/js/attribution.js"></script>
<script src="assets/js/appstore.js"></script>
<script>
// The one URL a bio gets, and it has one job: record the click and get out of
// the way. Instagram's webview used to swallow App Store links, so this page
// spent its life teaching runners how to escape it by hand. That is fixed —
// the link opens the store directly now, in-app browser or not — so the
// instructions are no longer the page, they are the floor under it: they
// appear only if the redirect provably did not take.
(function () {
  'use strict';

  var APP_STORE = 'https://apps.apple.com/us/app/cadence-run-coach/id6783027833';

  function stuck(app) {
    if (document.body.getAttribute('data-mode') === 'stuck') return;
    document.body.setAttribute('data-mode', 'stuck');

    // Instagram and Facebook are the only menus worth naming; anywhere else the
    // steps would be guessing at a control that may not exist, and the button
    // above them is the honest answer.
    if (app === 'instagram' || app === 'facebook') {
      document.getElementById('steps').style.display = 'block';
      document.getElementById('lede').textContent =
        'Tap below — or, if nothing happens, get there in two taps.';
    }
    if (window.cadenceTrack) window.cadenceTrack('web_app_store_blocked', { app: app || 'none' });
  }

  window.addEventListener('DOMContentLoaded', function () {
    var app = window.cadenceInAppBrowser ? window.cadenceInAppBrowser() : '';

    if (window.cadenceTrack) {
      window.cadenceTrack('web_app_store_click', { position: 'get_page', in_app_browser: app || 'none' });
    }

    // Still here well after the navigation was issued means it never happened.
    // Visibility is the signal rather than any event the webview reports: a
    // swallowed navigation raises no error, and a successful one backgrounds
    // this page.
    setTimeout(function () { if (!document.hidden) stuck(app); }, 2500);

    // A short beat before leaving. The capture above travels over the network,
    // and navigating immediately can cancel it in flight — which would lose
    // exactly the event this page exists to record. `replace` rather than
    // `assign` so the back button returns to Instagram rather than trapping
    // the runner on a page that instantly redirects again.
    setTimeout(function () { window.location.replace(APP_STORE); }, 400);
  });
})();
</script>
</body>
</html>
