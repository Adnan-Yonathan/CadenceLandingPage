<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Cadence — Get the app</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--cream:#f1f0e4;--sage:#94a894;--lime:#a3d13a;--card:#1e3320;--raised:#24401f;--deep:#0f1c12;--line:rgba(241,240,228,.12)}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;
background:radial-gradient(120% 60% at 50% -10%,#2e4820 0,var(--deep) 62%,#09120b 100%);
color:var(--cream);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-align:center}
.box{width:100%;max-width:380px}
.mark{width:78px;height:78px;border-radius:20px;margin:0 auto 22px;display:grid;place-items:center;
background:linear-gradient(145deg,var(--raised),var(--card));border:1px solid var(--line);font-size:34px}
h1{font-size:27px;line-height:1.15;letter-spacing:-.04em;margin:0 0 10px}
h1 .accent{color:var(--lime)}
p{font-size:15px;line-height:1.55;color:var(--sage);margin:0 0 26px}
.cta{display:block;width:100%;border:0;border-radius:999px;min-height:56px;background:var(--lime);
color:#10200c;font:inherit;font-weight:800;font-size:17px;cursor:pointer;text-decoration:none;
display:flex;align-items:center;justify-content:center;box-shadow:0 12px 32px rgba(163,209,58,.18)}
.alt{display:inline-block;margin-top:16px;color:var(--sage);font-size:13px;font-weight:700}
</style>
</head>
<body>
  <div class="box">
    <div class="mark">🏃</div>
    <h1>Get <span class="accent">Cadence</span></h1>
    <p id="msg">Taking you to the App Store…</p>
    <!-- A real anchor, not a button. If every script here fails, this still
         works, which is the whole point of the page. -->
    <a class="cta" id="go" href="https://apps.apple.com/us/app/cadence-run-coach/id6783027833" data-cta="direct">Open the App Store</a>
    <a class="alt" href="/">Read more about Cadence first →</a>
  </div>

<script src="assets/js/attribution.js"></script>
<script src="assets/js/appstore.js"></script>
<script>
// The page a campaign link points straight at. It exists because Instagram's
// in-app browser will not open the App Store from an ordinary link, and a bio
// has room for exactly one URL — so that URL has to be the one that handles the
// problem rather than the one that runs into it.
//
// The automatic attempt is made once, on load. iOS will usually honour a
// top-level scheme navigation without a tap, but not always, so the button
// below is the real contract and the auto-attempt is an optimisation.
(function () {
  'use strict';
  window.addEventListener('DOMContentLoaded', function () {
    var app = window.cadenceInAppBrowser ? window.cadenceInAppBrowser() : '';
    if (app) {
      document.getElementById('msg').textContent =
        'Tap below to open the App Store. ' +
        'If nothing happens, use the ⋯ menu to open this page in your browser.';
    }
    // openStore reports the click itself, so this is not tracked twice.
    if (window.cadenceOpenAppStore) window.cadenceOpenAppStore('direct');
  });
})();
</script>
</body>
</html>
