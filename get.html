<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Get Cadence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--cream:#f1f0e4;--sage:#94a894;--dim:#6f8570;--lime:#a3d13a;--card:#1e3320;--raised:#24401f;--deep:#0f1c12;--line:rgba(241,240,228,.12)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100dvh}
body{background:radial-gradient(115% 55% at 50% 0,#24401f 0,var(--deep) 58%,#070f09 100%);
color:var(--cream);font-family:Manrope,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;
display:flex;flex-direction:column;align-items:center;justify-content:center;
padding:calc(env(safe-area-inset-top) + 84px) 22px calc(env(safe-area-inset-bottom) + 34px);text-align:center}

/* The arrow lives against the top-right corner because that is where the
   control it refers to sits — in Instagram's own chrome, just above this
   document. It cannot point at the button directly, so it points at the corner
   and the copy names the glyph. */
.pointer{position:fixed;top:calc(env(safe-area-inset-top) + 6px);right:14px;z-index:3;
display:flex;flex-direction:column;align-items:flex-end;gap:2px;pointer-events:none;
animation:nudge 1.8s ease-in-out infinite}
.pointer svg{width:60px;height:62px;color:var(--lime);filter:drop-shadow(0 3px 10px rgba(0,0,0,.5))}
.pointer b{font-size:12px;font-weight:800;color:var(--lime);letter-spacing:.02em;
background:rgba(15,28,18,.82);border:1px solid rgba(163,209,58,.3);border-radius:999px;padding:4px 11px;
white-space:nowrap;margin-right:2px}
@keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(5px,-7px)}}

.icon{width:104px;height:104px;border-radius:26px;display:block;margin:0 auto 24px;
box-shadow:0 0 0 1px rgba(241,240,228,.08),0 20px 54px rgba(0,0,0,.55),0 0 70px rgba(163,209,58,.16)}
h1{font-size:31px;line-height:1.1;letter-spacing:-.045em;margin:0 0 12px}
h1 .accent{color:var(--lime)}
.lede{font-size:15px;line-height:1.55;color:var(--sage);margin:0 0 30px;max-width:330px}

.steps{width:100%;max-width:360px;background:rgba(0,0,0,.26);border:1px solid var(--line);
border-radius:18px;overflow:hidden;text-align:left}
.step{display:flex;align-items:center;gap:13px;padding:15px 16px;font-size:15px;line-height:1.4;font-weight:600}
.step+.step{border-top:1px solid var(--line)}
.step i{flex:none;width:23px;height:23px;border-radius:50%;background:rgba(163,209,58,.14);
color:var(--lime);font-style:normal;font-size:12px;font-weight:800;display:grid;place-items:center}
.glyph{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:25px;
padding:0 8px;margin:0 2px;border-radius:7px;background:var(--raised);border:1px solid var(--line);
color:var(--cream);font-size:13px;font-weight:800;vertical-align:middle;letter-spacing:.06em}
.tagline{font-size:13px;line-height:1.5;color:var(--dim);margin:28px 0 0;max-width:300px}

/* Shown only while a real browser is being redirected — a beat of explanation
   so the jump does not look like a glitch. */
.sending{display:none;flex-direction:column;align-items:center;gap:16px}
.sending .ring{width:34px;height:34px;border-radius:50%;border:3px solid rgba(241,240,228,.13);
border-top-color:var(--lime);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
body[data-mode="sending"] .in-app{display:none}
body[data-mode="sending"] .sending{display:flex}
body[data-mode="sending"] .pointer{display:none}
</style>
</head>
<body data-mode="in-app">

  <div class="pointer" id="pointer" aria-hidden="true">
    <svg viewBox="0 0 60 62" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M8 58C8 34 20 14 46 8" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="0.1 9"/>
      <path d="M34 6.5L47.5 7L45 20.5" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <b>up here</b>
  </div>

  <div class="in-app">
    <img class="icon" src="images/app-icon.png" alt="Cadence" width="104" height="104">
    <h1>Get <span class="accent">Cadence</span></h1>
    <p class="lede" id="lede">Instagram's browser can't open the App&nbsp;Store. Two taps and you're there.</p>

    <div class="steps">
      <div class="step"><i>1</i><span>Tap the <span class="glyph">•••</span> menu, top right</span></div>
      <div class="step"><i>2</i><span>Choose <span class="glyph" style="font-size:12px;letter-spacing:0">Open in browser</span></span></div>
      <div class="step"><i>3</i><span>The App&nbsp;Store opens on its own</span></div>
    </div>

    <p class="tagline">The running coach that keeps you accountable.</p>
  </div>

  <div class="sending" aria-live="polite">
    <img class="icon" src="images/app-icon.png" alt="Cadence" width="104" height="104" style="margin-bottom:6px">
    <div class="ring"></div>
    <p class="lede" style="margin:0">Opening the App&nbsp;Store…</p>
  </div>

<script src="assets/js/attribution.js"></script>
<script src="assets/js/appstore.js"></script>
<script>
// The one URL a bio gets, and it has two entirely different jobs depending on
// who opens it.
//
// Inside Instagram's webview the App Store cannot be reached at all — no
// button here would work, which is why there is no button. The page's whole
// purpose in that case is to teach the two taps that get the runner out, and
// step 3 is a promise this file keeps: once the link reopens in a real
// browser, the redirect below fires and they never touch a button.
//
// Anywhere else, this page is a turnstile. It records the click and gets out
// of the way.
(function () {
  'use strict';

  var APP_STORE = 'https://apps.apple.com/us/app/cadence-run-coach/id6783027833';

  function go() {
    document.body.setAttribute('data-mode', 'sending');
    if (window.cadenceTrack) {
      window.cadenceTrack('web_app_store_click', { position: 'get_page', in_app_browser: 'none' });
    }
    // A short beat before leaving. The capture above travels over the network,
    // and navigating immediately can cancel it in flight — which would lose
    // exactly the event this page exists to record. `replace` rather than
    // `assign` so the back button returns to Instagram rather than trapping
    // the runner on a page that instantly redirects again.
    setTimeout(function () { window.location.replace(APP_STORE); }, 400);
  }

  window.addEventListener('DOMContentLoaded', function () {
    var app = window.cadenceInAppBrowser ? window.cadenceInAppBrowser() : '';

    if (!app) { go(); return; }

    // Instagram is the common case and gets named. Anything else keeps the
    // wording generic rather than guessing at a menu it may not have.
    if (app !== 'instagram') {
      document.getElementById('lede').textContent =
        "This in-app browser can't open the App Store. Two taps and you're there.";
    }
    if (window.cadenceTrack) window.cadenceTrack('web_app_store_blocked', { app: app });
  });
})();
</script>
</body>
</html>
